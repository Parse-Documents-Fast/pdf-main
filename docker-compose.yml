services:
  pdf-main:
    build: .
    image: pdf-main:1.13-tomcat
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      # ADR-0008: límite único de subida (el .env raíz es la fuente de verdad).
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20}
    deploy:
      replicas: ${PDF_MAIN_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fast_pdf_network
    # No ports exposed to the host: only reachable through Traefik.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pdf-main.rule=Host(`api.pdfmanager.local`)"
      - "traefik.http.routers.pdf-main.entrypoints=https"
      - "traefik.http.routers.pdf-main.tls=true"
      - "traefik.http.routers.pdf-main.middlewares=rate-limit-redis@file,cb-documents@file"

networks:
  fast_pdf_network:
    external: true